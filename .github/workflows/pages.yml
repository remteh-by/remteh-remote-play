name: Deckivo site
on:
  push:
    branches: [main]
    paths: ['website/**', 'localization/**', 'design-system/**', 'scripts/build-site.py', 'scripts/generate-support.py', 'scripts/requirements-build.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate support and static language pages
        run: |
          python -m pip install -r scripts/requirements-build.txt
          python scripts/generate-support.py --check
          python scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
