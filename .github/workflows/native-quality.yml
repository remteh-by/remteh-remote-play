name: Deckivo native quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build the SDL2 version used by the Mac candidate
        run: |
          test "$(uname -m)" = arm64
          command -v clang
          sdl_archive="$RUNNER_TEMP/SDL2-2.32.10.tar.gz"
          curl --fail --location --retry 3 https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz --output "$sdl_archive"
          printf '%s  %s\n' 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165 "$sdl_archive" | shasum -a 256 -c -
          tar -xzf "$sdl_archive" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL2-2.32.10" -B "$RUNNER_TEMP/sdl2-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl2" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl2-build" --parallel 3
          cmake --install "$RUNNER_TEMP/sdl2-build"
      - run: python -m pip install -r desktop/macos/requirements.txt cryptography
      - run: python -m unittest discover -s desktop/linux/tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          DECKIVO_TEST_SDL_PREFIX: ${{ runner.temp }}/sdl2
          DECKIVO_REQUIRE_MAC_NATIVE_TESTS: '1'
      - name: Native input state regression
        run: |
          clang -std=c11 -Wall -Wextra -Werror desktop/macos/test-input-state.c -o "$RUNNER_TEMP/deckivo-input-test"
          "$RUNNER_TEMP/deckivo-input-test"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git submodule update --init third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl android/app/src/main/cpp/oboe
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler ninja-build
          python -m venv .buildenv
          .buildenv/bin/python -m pip install protobuf==7.34.2 cmake==4.4.4
          .buildenv/bin/python -c 'import cmake,pathlib; pathlib.Path("android/local.properties").write_text("cmake.dir="+str(pathlib.Path(cmake.CMAKE_BIN_DIR).parent)+"\n")'
          echo "$PWD/.buildenv/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
      - run: ./android/gradlew -p android --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: deckivo-unsigned-android-candidate
          path: android/app/build/outputs/apk/release/*unsigned.apk
          retention-days: 14
