name: Windows x64 preview build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['desktop/windows/**', '.github/workflows/windows-preview.yml']
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
jobs:
  package:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: git make diffutils gnupg curl
          pacboy: >-
            cmake:p ffmpeg:p gcc:p hidapi:p json-c:p libevent:p libplacebo:p
            miniupnpc:p ninja:p openssl:p opus:p pkgconf:p protobuf:p python-protobuf:p
            qt6-base:p qt6-declarative:p qt6-svg:p sdl2-compat:p speexdsp:p
      - name: Compile the pinned engine and Windows overlay
        shell: pwsh
        env:
          MSYSROOT: ${{ steps.msys.outputs.msys2-location }}
        run: ./desktop/windows/build.ps1 -MsysRoot $env:MSYSROOT -Work D:/deckivo-build
      - name: Check controls, saved settings and update signatures
        shell: msys2 {0}
        run: bash desktop/windows/test.sh /d/deckivo-build/engine
      - name: Build the installer and ZIP
        shell: pwsh
        env:
          MSYSROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (!$iscc) { $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" }
          ./desktop/windows/package.ps1 -Engine D:/deckivo-build/engine -MsysRoot $env:MSYSROOT -Destination D:/deckivo-release -Iscc $iscc -Python "$env:MSYSROOT/ucrt64/bin/python.exe"
          $packages = Get-ChildItem D:/deckivo-release -File
          $packages | ForEach-Object { (Get-FileHash $_).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content D:/deckivo-release/SHA256SUMS.txt
      - name: Test installed and portable payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem D:/deckivo-release/*Setup.exe
          $zip = Get-ChildItem D:/deckivo-release/*.zip
          $installed = "$env:LOCALAPPDATA/Programs/Deckivo"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/NORESTART','/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode) { throw 'Installer failed' }
          $linkPath = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Deckivo.lnk'
          if (!(Test-Path -LiteralPath $linkPath)) { throw 'Desktop shortcut missing' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($linkPath)
          if ($shortcut.TargetPath -ne (Join-Path $installed 'Deckivo.exe')) { throw 'Wrong shortcut' }
          if ($shortcut.IconLocation -notlike '*\deckivo.ico,0') { throw 'Wrong shortcut icon' }
          tar -xf $zip.FullName -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'ZIP extraction failed' }
          $portable = Join-Path $env:RUNNER_TEMP 'Deckivo'
          foreach ($file in Get-ChildItem $portable -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($portable,$file.FullName)
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash (Join-Path $installed $relative)).Hash) { throw "Package mismatch: $relative" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: deckivo-windows-preview
          path: |
            D:/deckivo-release/*.exe
            D:/deckivo-release/*.zip
            D:/deckivo-release/SHA256SUMS.txt

  publish-windows-preview:
    needs: package
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/windows-0.9.0-build5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: deckivo-windows-preview
          path: packages
      - name: Publish the verified Windows-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -eu
          (cd packages && sha256sum --check SHA256SUMS.txt)
          tag=v0.9.0-windows-preview.5
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The prerelease already exists; leaving its assets intact."
            exit 0
          fi
          gh release create "$tag" packages/*.exe packages/*.zip packages/SHA256SUMS.txt --target "$TARGET" --title "Deckivo 0.9.0.5 — Windows x64 Preview" --notes-file desktop/windows/RELEASE.md --prerelease --latest=false
