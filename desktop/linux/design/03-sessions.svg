"112" width="1136" height="190" rx="20" fill="#1A1E24" stroke="#303640"/><text x="142" y="157" fill="#F3F5F7" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="600">Your next session starts here.</text><text x="142" y="197" fill="#A4ACBA" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400">Session time, profile and decoded frames are recorded locally.</text><text x="142" y="246" fill="#A4ACBA" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">No sample sessions or invented performance figures.</text><text x="116" y="613" fill="#A4ACBA" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="400">Diagnostics exclude IP addresses, accounts, pairing keys and raw logs.</text><g aria-label="Export safe diagnostics"><rect x="950" y="590" width="302" height="48" rx="12" fill="#222730" stroke="#303640"/><text x="968" y="620" fill="#F3F5F7" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600">Export safe diagnostics</text></g></g></svg>